env:
  num_cells: 7
  max_steps: 200
  seed: 42

model:
  obs_dim: 3
  action_dim: 3

training:
  num_episodes: 1000
  log_every: 10
  checkpoint_every: 100
  checkpoint_dir: results/checkpoints
  log_csv_path: results/logs/training_log.csv

eval:
  eval_every: 100
  eval_episodes: 10
  deterministic: true